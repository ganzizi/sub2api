name: sync-upstream

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "ganzizi"
          git config user.email "756951735@qq.com"
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "fork main already contains upstream/main"
            exit 0
          fi
          git merge --no-edit upstream/main
          git push origin HEAD:main
          # GITHUB_TOKEN 推送不会触发 push 工作流，必须显式发布 GHCR latest。
          # 上面加了 upstream remote 后，gh 会默认选中上游仓库；必须指定本 fork。
          gh workflow run publish-image.yml --repo "${GITHUB_REPOSITORY}" --ref main
